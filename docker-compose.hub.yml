services:
  backend:
    image: giakhanh080505/mern-backend:1.0
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=5000

  frontend:
    image: giakhanh080505/mern-frontend:2.0
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile
    ports:
      - "3000:80"