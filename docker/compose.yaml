services:
  backend:
    container_name: mern-backend
    build:
      context: ../mern-demo
      dockerfile: server/Dockerfile
    env_file:
      - ../mern-demo/.env
    ports:
      - "5000:5000"

  frontend:
    container_name: mern-frontend
    build:
      context: ../mern-demo/client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
